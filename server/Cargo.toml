[package]
name = "spiritstream-server"
version = "1.2.1"
description = "SpiritStream HTTP server entrypoint. The HTTP transport lives in spiritstream-transport-http; this binary just wires it to spiritstream-core."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "spiritstream-server"
path = "src/main.rs"

[dependencies]
spiritstream-core = { path = "../crates/core" }
spiritstream-transport-http = { path = "../crates/transport-http" }

tokio = { version = "1.0", features = ["rt-multi-thread", "macros"] }
