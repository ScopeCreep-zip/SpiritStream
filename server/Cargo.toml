[package]
name = "spiritstream-server"
version = "1.1.1"
description = "SpiritStream Backend Server - Multi-Destination Streaming Application"
authors = ["SpiritStream Contributors"]
license = "ISC"
repository = "https://github.com/ScopeCreep-zip/SpiritStream"
edition = "2021"
rust-version = "1.77.2"

[dependencies]
# HTTP/WS
axum = { version = "0.7", features = ["json", "ws", "macros"] }
tower-http = { version = "0.5", features = ["cors", "fs", "set-header"] }
tokio = { version = "1.0", features = ["full"] }
tower-cookies = "0.10"

# Security
subtle = "2.5"
governor = "0.6"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Encryption
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
base64 = "0.22"
zeroize = { version = "1.7", features = ["derive"] }

# Concurrent collections
dashmap = "6"
parking_lot = "0.12"

# Utilities
uuid = { version = "1.0", features = ["v4", "serde"] }
which = "6.0"
urlencoding = "2.1"
log = { version = "0.4", features = ["std"] }
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
regex = "1.10"
notify = "6"
dirs-next = "2.0"
opener = "0.7"
bytes = "1.5"
tokio-stream = { version = "0.1", features = ["sync"] }
async-stream = "0.3"

# Native Capture
scap = "0.0.8"
cpal = { version = "0.17", features = ["jack"] }
image = "0.25"
turbojpeg = { version = "1.4", default-features = false, features = ["pkg-config"] }

# Audio decode (in-process, replaces FFmpeg astats subprocesses)
symphonia = { version = "0.5", features = ["mp3", "aac", "flac", "pcm", "vorbis", "isomp4", "mkv", "ogg", "wav"] }

# Audio resampling (pure Rust, SIMD-optimized)
rubato = "0.16"

# RNNoise noise suppression (pure Rust, no system deps)
nnnoiseless = "0.2"

# Wait-free ring buffers for audio callbacks
rtrb = "0.3"

# FFmpeg Download
reqwest = { version = "0.11", features = ["stream", "json", "blocking"] }
zip = "0.6"
tar = "0.4"
xz2 = "0.1"
flate2 = "1.0"
sha2 = "0.10"
hex = "0.4"
futures-util = "0.3"
tempfile = "3.10"

# Platform-specific
[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["fileapi", "winnt"] }
windows-sys = { version = "0.59", features = ["Win32_System_Threading"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

# macOS-specific (for advanced device discovery and screen capture)
[target.'cfg(target_os = "macos")'.dependencies]
# screencapturekit-rs provides Rust bindings for ScreenCaptureKit (macOS 13.0+)
# Enables: display/window enumeration, system audio capture, GPU-accelerated video
screencapturekit = "1.5"
# Objective-C runtime bindings for NSProcessInfo (App Nap, Low Power Mode)
# Also needed for OBS-parity camera-audio pairing via associatedPersistentID
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSProcessInfo", "NSString"] }

[build-dependencies]
serde_json = "1.0"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = true
strip = true
opt-level = 3
