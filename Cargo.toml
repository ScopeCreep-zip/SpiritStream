[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/transport-http",
    "crates/transport-cli",
    "crates/transport-veilid",
    "server",
    "apps/tauri/src-tauri",
]
# Vendored only to apply a Windows-path fix to its build.rs (see
# third_party/piratetok-live-rs/build.rs); not a workspace member.
exclude = [
    "third_party/piratetok-live-rs",
]

[workspace.package]
edition = "2021"
rust-version = "1.77.2"
license = "GPL-3.0"
repository = "https://github.com/ScopeCreep-zip/SpiritStream"
authors = ["SpiritStream Contributors"]

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
# Tighten as the rewrite lands; CI already runs `cargo clippy -D warnings`.
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

# Upstream piratetok-live-rs 0.2.0 ships a build.rs whose "build
# constitution" scan hardcodes forward-slash exemption paths, so it
# spuriously panics on Windows (read_dir yields backslash paths). The
# vendored copy applies a one-line separator-normalization fix; library
# code is byte-identical, so this is a no-op on Linux/macOS. Drop once a
# fixed release is published upstream.
[patch.crates-io]
piratetok-live-rs = { path = "third_party/piratetok-live-rs" }
