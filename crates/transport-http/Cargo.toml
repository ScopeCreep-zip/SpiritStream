[package]
name = "spiritstream-transport-http"
description = "Axum + utoipa HTTP transport adapter for spiritstream-core."
version = "1.2.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
name = "spiritstream_transport_http"
path = "src/lib.rs"

[dependencies]
# Core business logic — this crate is a thin transport adapter around it.
spiritstream-core = { path = "../core" }

# HTTP / WS
axum = { version = "0.7", features = ["json", "ws"] }
tower-http = { version = "0.5", features = ["cors", "fs", "set-header"] }
tower-cookies = "0.10"

# OpenAPI generation. utoipa 4.x is the latest series compatible with axum 0.7;
# bump to utoipa 5 alongside the axum upgrade in a later phase.
utoipa = { version = "4", features = ["axum_extras", "chrono", "uuid"] }
utoipa-axum = "0.1"
utoipa-swagger-ui = { version = "7", features = ["axum"] }

# Auth + rate limiting (HTTP-specific concerns)
subtle = "2.5"
governor = "0.6"

# Runtime
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1"
futures-util = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Utilities used by handlers (logging, IDs, times, errors, paths)
log = { version = "0.4", features = ["std"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "v7", "serde"] }
thiserror = "1.0"
regex = "1.10"
dirs-next = "2.0"
opener = "0.7"
urlencoding = "2.1"
dotenvy = "0.15"
url = "2.5"
reqwest = { version = "0.11", features = ["stream", "json", "multipart"] }
zeroize = { version = "1.7", features = ["derive"] }
base64 = "0.22"
hex = "0.4"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["fileapi", "winnt"] }

[dev-dependencies]
# Integration test plumbing: boot the server binary, hit it with HTTP.
reqwest = { version = "0.11", features = ["blocking", "json"] }
tempfile = "3.10"
tokio = { version = "1.0", features = ["macros", "rt"] }
# Property-based fuzz testing for the `mask_sensitive` redactor.
proptest = "1"
