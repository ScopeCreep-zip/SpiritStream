[package]
name = "spiritstream-cli"
description = "Headless CLI client for SpiritStream. Dispatches in-process against spiritstream-core; never shells out to HTTP."
version = "1.2.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "spiritstream-cli"
path = "src/main.rs"

[dependencies]
spiritstream-core = { path = "../core" }

# Command parsing + tokio runtime
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1.0", features = ["rt-multi-thread", "macros"] }

# JSON output
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error mapping
thiserror = "1.0"

# Filesystem + logging
dirs-next = "2.0"
dirs = "5.0"
log = "0.4"
env_logger = "0.11"

# Chat-log timestamp formatting (matches the HTTP layer's chrono usage).
chrono = "0.4"

[dev-dependencies]
tempfile = "3.10"
