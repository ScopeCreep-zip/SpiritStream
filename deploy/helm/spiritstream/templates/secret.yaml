{{- if and (not .Values.apiTokenSecretRef.name) .Values.apiToken }}
# Inline-API-token Secret. PREFER `apiTokenSecretRef` to keep the
# token out of git / Helm values — this is here as the simplest path
# for first-deploy.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "spiritstream.fullname" . }}-token
  labels:
    {{- include "spiritstream.labels" . | nindent 4 }}
type: Opaque
data:
  token: {{ .Values.apiToken | b64enc | quote }}
{{- end }}
