{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "spiritstream.fullname" . }}
  labels:
    {{- include "spiritstream.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "spiritstream.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  # Ingress: only the ingress controller talks to us. The ingress
  # class label is implementation-specific; tighten via your cluster's
  # actual selector.
  ingress:
    - ports:
        - protocol: TCP
          port: 8008
  egress:
    {{- if .Values.networkPolicy.allowAllEgress }}
    - {}
    {{- else }}
    {{- toYaml .Values.networkPolicy.egress | nindent 4 }}
    {{- end }}
{{- end }}
