<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      The Content-Security-Policy <meta> is injected at BUILD time only (see
      the `cspMetaInjection` plugin in vite.config.ts) so production ships a
      strict `script-src 'self'` policy while the dev server stays unrestricted
      — Vite's React-refresh preamble is an inline script that a strict static
      meta would block, breaking HMR. Shipped surfaces also carry CSP via the
      Tauri webview config and the transport-http response header.
    -->
    <!-- STEP 1: Restore persisted theme + contrast BEFORE any CSS loads. -->
    <!--
      Externalized to /theme-init.js so the production CSP needs no
      `'unsafe-inline'`; still render-blocking from <head>, so it completes
      before the first stylesheet parses (zero flash for custom/high-contrast).
    -->
    <script src="/theme-init.js"></script>

    <!-- STEP 2: CSS now sees data-theme already set - no flash -->
    <!--
      Externalized to /boot.css (not an inline <style>) so the production CSP
      needs no `'unsafe-inline'` in style-src; still render-blocking from <head>,
      so it completes before first paint. Both modes are selector-based — no
      :root defaults needed.
    -->
    <link rel="stylesheet" href="/boot.css" />
    <title>SpiritStream</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
