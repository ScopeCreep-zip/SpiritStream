[package]
name = "spiritstream-desktop"
version = "1.2.1"
description = "SpiritStream Desktop - Multi-Destination Streaming Application"
authors = ["SpiritStream Contributors"]
license = "ISC"
repository = "https://github.com/ScopeCreep-zip/SpiritStream"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "spiritstream_desktop_lib"
path = "src/lib.rs"
# `cdylib` + `staticlib` keep this lib linkable from the Tauri mobile
# shells (iOS / Android) without changing the desktop binary build.
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "spiritstream-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-log = "2"
# Must register FIRST so a second launch forwards to the running
# instance instead of killing its backend out from under it.
tauri-plugin-single-instance = "2"
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
# App self-update via GitHub Releases. Signing happens locally on the
# maintainer's machine (private key never enters CI); the public key is
# embedded in `tauri.conf.json` `plugins.updater.pubkey` and used by
# this plugin to verify the `.sig` files attached to each release.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Pid-identity verification for the tracked-pid sidecar reaper.
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
thiserror = "2"
# Global system-wide hotkeys. Used by the panic shortcut so it fires
# from anywhere on the system — not only when SpiritStream has focus.
# Frontend registers the binding via `@tauri-apps/plugin-global-shortcut`;
# this exposes the OS-level hook.
tauri-plugin-global-shortcut = "2"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async — `net` is required by the TCP-listening probe in run_launcher
# (TcpStream::connect); other features are for the existing process/timer use.
tokio = { version = "1.0", features = ["process", "time", "net", "rt-multi-thread"] }

# Utilities
log = "0.4"
tauri-plugin-http = "2"

[dev-dependencies]
tempfile = "3.10"
tokio = { version = "1.0", features = ["macros", "rt", "time"] }
