name: Dependency Review

# OWASP CICD-SEC-3 (Dependency Chain Abuse) +
# NIST SSDF PW.3 (vet reusable components).
#
# Runs on PRs only. Compares the dependency graph between base and head
# refs; fails the PR if any newly-introduced dep has a high-or-worse vuln
# OR a license not on the workspace allowlist. License allowlist matches
# what `deny.toml` enforces at the cargo layer so frontend / Rust stay in
# sync.

on:
  pull_request:
    branches: [main, kali/rewrite]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      pull-requests: write # post the inline review comment
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Dependency Review
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high
          # License allowlist — keep in sync with deny.toml [licenses]
          # block. SpiritStream itself is ISC; we accept permissive +
          # weak-copyleft licenses with full attribution.
          allow-licenses: ISC, MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, Unicode-DFS-2016, Unicode-3.0, Zlib, MPL-2.0, CC0-1.0, 0BSD, Apache-2.0 WITH LLVM-exception
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-1.0, AGPL-3.0, LGPL-2.0, LGPL-3.0, CC-BY-NC-1.0, CC-BY-NC-2.0, CC-BY-NC-3.0, CC-BY-NC-4.0
          comment-summary-in-pr: on-failure
          retry-on-snapshot-warnings: true
