name: Secret Scan

# CISA "Defending CI/CD" (June 2023 CSI) §Secrets Management +
# NIST SSDF PO.3 + OWASP CICD-SEC-6 (Credential Hygiene).
#
# Belt-and-braces on top of GitHub's native secret scanning + push
# protection (enabled in repo settings). Native scanning catches known
# token shapes from supported providers; gitleaks catches anything that
# matches generic high-entropy or custom patterns. Running both means
# either layer alone can't be silently disabled without alerting.

on:
  push:
    branches: [main, kali/rewrite, tauri-shift]
  pull_request:
    branches: [main, kali/rewrite]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      pull-requests: write # post inline finding comment
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # Full history so gitleaks can scan all commits introduced by
          # the PR, not just the merge commit.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # gitleaks defaults are strong; only override if false positives
          # become a regular problem (add a .gitleaks.toml at repo root).
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'true'
          GITLEAKS_ENABLE_SUMMARY: 'true'
