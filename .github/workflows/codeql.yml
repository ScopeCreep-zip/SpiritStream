name: CodeQL

# NIST SSDF PW.7 (automated security testing) +
# CISA "Defending CI/CD" §SAST recommendation +
# OWASP ASVS 5.0 V14.5.1.
#
# CodeQL runs as a status check on every PR plus a weekly cron so freshly
# released queries catch vulns introduced by code that hasn't changed
# since merge. Rust support is in public preview as of 2026; if it fails
# we still get the JS/TS coverage.

on:
  push:
    branches: [main, kali/rewrite]
  pull_request:
    branches: [main, kali/rewrite]
  schedule:
    # Mondays 06:13 UTC — off-peak, off-hour so new query bundles get
    # tried against the latest tree weekly.
    - cron: '13 6 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      security-events: write    # upload SARIF to Code Scanning
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          - language: rust
            build-mode: manual
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@458d36d7d4f47d0dd16ca424c1d3cda0060f1360 # v3.35.5
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # security-and-quality runs both security and code-quality
          # queries; for vulnerable-user-facing code we want every
          # finding surfaced, not just the curated security set.
          queries: security-and-quality

      # Rust build needs the same prerequisites as the test job; mirror
      # the relevant subset so the database is complete.
      - name: Install Rust toolchain (Rust matrix only)
        if: matrix.language == 'rust'
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master @ 2026-05; no semver tags
        with:
          toolchain: stable

      - name: Install Linux deps (Rust matrix only)
        if: matrix.language == 'rust'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Build Rust workspace (Rust matrix only)
        if: matrix.language == 'rust'
        run: cargo check --workspace --exclude spiritstream-tauri

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@458d36d7d4f47d0dd16ca424c1d3cda0060f1360 # v3.35.5
        with:
          category: '/language:${{ matrix.language }}'
