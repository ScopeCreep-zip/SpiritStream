name: CI

# CISA "Defending CI/CD" (June 2023) + NIST SP 800-218 PO.3 / PW.5:
# - Every action SHA-pinned (defeats tag-mutation / poisoned-pipeline-execution).
# - Default token permissions are read-only at workflow root; jobs that need
#   more must declare it explicitly. Dependabot bumps these via `chore(deps,ci)`.
# - StepSecurity harden-runner runs first in every job for egress visibility.
# - Concurrency cancels superseded PR runs to free runners and shrink the
#   window for in-flight tampering.

on:
  push:
    branches: [main, kali/rewrite, tauri-shift]
  pull_request:
    branches: [main, kali/rewrite]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Supply-chain audit. Runs on every push so a freshly
  # discovered CVE in a transitive dep blocks the merge.
  cargo-audit:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.13.1
        with:
          egress-policy: audit

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master @ 2026-05; no semver tags
        with:
          toolchain: stable
      - name: Install cargo-audit
        run: cargo install --locked cargo-audit
      - name: cargo audit
        run: cargo audit --deny warnings

  pnpm-audit:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 9.15.0
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: pnpm audit
        # Block on `high` and `critical`; `moderate` lands as a
        # warning in the job summary so we triage without blocking
        # emergency merges.
        run: pnpm audit --audit-level=high

      # OWASP CICD-SEC-3 (Dependency Chain Abuse): the lockfile is the
      # single source of truth for which package version + integrity hash
      # actually gets installed. lockfile-lint refuses to bless any source
      # outside the official registries and any non-HTTPS URL. pnpm-lock
      # support landed in lockfile-lint 4.13.
      - name: Validate pnpm-lock.yaml integrity
        run: pnpm exec lockfile-lint --path pnpm-lock.yaml --type pnpm --validate-https --allowed-hosts npm github.com

  # axe-core accessibility audit on the built frontend.
  a11y-axe:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 9.15.0
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build frontend
        run: pnpm run build:web
      - name: Run axe-core against the built bundle
        # Loads `apps/web/dist/index.html` in a headless Chromium
        # context, injects axe-core, and asserts zero serious/critical
        # violations. Plain-script entry under `tests/a11y/`.
        run: pnpm tsx tests/a11y/axe-run.ts apps/web/dist

  test:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
            rust_target: 'aarch64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
            rust_target: ''
          - platform: 'windows-latest'
            args: ''
            rust_target: ''

    runs-on: ${{ matrix.platform }}
    steps:
      # harden-runner only ships an enforcing build for Linux; on macOS /
      # Windows it falls back to a no-op (`disable-sudo: false` etc are
      # ignored). Keep the call for parity so future Linux-only enforcement
      # changes don't require adding the step back to every matrix entry.
      - name: Harden runner
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      # rust-toolchain.toml at repo root pins the channel, components,
      # and targets. dtolnay/rust-toolchain reads it automatically; the
      # only thing we override is the per-matrix target.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master @ 2026-05; no semver tags
        with:
          toolchain: stable
          targets: ${{ matrix.rust_target }}
          components: clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: |
            server -> target
            apps/tauri/src-tauri -> target

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        run: pnpm run typecheck

      - name: Rust check (server)
        run: cargo check --manifest-path server/Cargo.toml

      - name: Rust clippy (server)
        run: cargo clippy --manifest-path server/Cargo.toml -- -D warnings

      - name: Build frontend
        run: pnpm run build:web

      - name: Build server sidecar
        run: pnpm run build:server ${{ matrix.rust_target && format('-- --target {0}', matrix.rust_target) || '' }}

      # Desktop checks must come after sidecar build (Tauri build.rs requires sidecar binary)
      - name: Rust check (desktop)
        run: cargo check --manifest-path apps/tauri/src-tauri/Cargo.toml ${{ matrix.rust_target && format('--target {0}', matrix.rust_target) || '' }}

      - name: Rust clippy (desktop)
        run: cargo clippy --manifest-path apps/tauri/src-tauri/Cargo.toml ${{ matrix.rust_target && format('--target {0}', matrix.rust_target) || '' }} -- -D warnings

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@a32a76cf0a532b3e3b8d0cfb6039e2d574aace68 # action-v0.5.4 (last node20-compatible build)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/tauri
          tauriScript: pnpm tauri
          args: ${{ matrix.args }}
