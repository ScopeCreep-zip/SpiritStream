name: Publish Package

# CISA / NIST SSDF PO.3: least-privilege token, SHA-pinned actions,
# harden-runner for egress visibility, default read-only at workflow root.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (leave empty to use package.json version)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write     # required to publish to GHCR npm registry
      id-token: write     # required for npm provenance statements
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@${{ github.repository_owner }}'
          cache: 'pnpm'

      - name: Update package scope
        run: |
          # Update package name to match repository owner
          sed -i 's|"name": "@[^/]*/|"name": "@${{ github.repository_owner }}/|' package.json

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm run vite:build

      - name: Update version (if specified)
        if: ${{ github.event.inputs.version != '' }}
        run: pnpm version ${{ github.event.inputs.version }} --no-git-tag-version

      # `--provenance` writes an npm provenance statement bound to this
      # workflow run's OIDC identity (npm + Sigstore). Consumers can
      # verify with `npm view <pkg> --json | jq .dist.attestations` or
      # automatically via `npm audit signatures`. NIST SP 800-204D §4.3,
      # OWASP CICD-SEC-9.
      - name: Publish to GitHub Packages with provenance
        run: pnpm publish --no-git-checks --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
