name: PR Quality

# Anti-AI-slop / contributor-friction gates that catch problems before
# a human reviewer has to spend cycles on them.
#
# Authority backing:
#   - OWASP CICD-SEC-1 (Insufficient Flow Control) — required PR review
#   - NIST SSDF PW.6 (peer-reviewed code) — enforces commit-message + scope
#   - CISA Defending CI/CD §Trust & Provenance — issue link / AI disclosure
#   - Linux kernel AI-contribution rule (May 2026): `Assisted-by:` trailer
#     mandatory if AI was material; human submitter accountable.
#   - Rust RFC #3950 §Understand + Explain
#
# Bypass labels (apply to PR before re-running this workflow):
#   - `no-issue-required` — refactors with no tracking issue
#   - `large-pr-approved` — owner-approved oversized changeset
#   - `skip-ai-disclosure-check` — for cases where AI text appears in
#     fixtures / docs (use sparingly; reviewer must confirm)

on:
  pull_request:
    branches: [main, kali/rewrite]
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commitlint:
    name: Commit message lint (conventional-commits)
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # Full history so commitlint can iterate every commit in the PR.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # commitlint runs against every commit between base and head. Config
      # is at repo root in commitlint.config.cjs; extends conventional and
      # locks scopes to .claude/rules/git-workflow.md.
      - name: Run commitlint
        uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6.2.1
        with:
          configFile: commitlint.config.cjs
          firstParent: false
          failOnWarnings: true
          failOnErrors: true
          helpURL: https://github.com/${{ github.repository }}/blob/main/CONTRIBUTING.md#commit-message-format

  ai-disclosure:
    name: AI-assistance disclosure (Assisted-by trailer)
    runs-on: ubuntu-22.04
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip-ai-disclosure-check') }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      # SpiritStream follows the Linux-kernel rule: if AI assistance was
      # material to the change, the commit must include an `Assisted-by:`
      # trailer naming the tool. Mentioning AI in the body without that
      # trailer is a process bug (and a frequent AI-slop tell).
      - name: Verify Assisted-by trailers on AI-mentioning commits
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tool_pattern='(claude|copilot|chatgpt|gpt-?[0-9]|gemini|cursor|codeium|tabnine|llm|ai-generated|ai-written|generated by ai)'
          fail=0
          mapfile -t commits < <(git log --format='%H' "$BASE..$HEAD")
          for sha in "${commits[@]}"; do
            msg=$(git log --format='%B' -n 1 "$sha")
            mentions_ai=false
            if printf '%s' "$msg" | grep -qiE "$tool_pattern"; then
              mentions_ai=true
            fi
            has_trailer=false
            if printf '%s' "$msg" | grep -qiE '^Assisted-by:[[:space:]]*[A-Za-z]'; then
              has_trailer=true
            fi
            if $mentions_ai && ! $has_trailer; then
              echo "::error title=Missing Assisted-by trailer::Commit $sha mentions an AI tool but has no \`Assisted-by:\` trailer. See https://github.com/${REPO}/blob/main/CONTRIBUTING.md#ai-assisted-contributions"
              fail=1
            fi
          done
          exit $fail

  issue-link:
    name: Issue link required
    runs-on: ubuntu-22.04
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'no-issue-required') }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit

      - name: Verify PR body links a tracking issue
        env:
          BODY: ${{ github.event.pull_request.body }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail
          # GitHub closing keywords + optional same-repo or owner/repo prefix
          pattern='(close[sd]?|fix(e[sd])?|resolve[sd]?)[[:space:]]+([A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+)?#[0-9]+'
          if printf '%s' "${BODY:-}" | grep -qiE "$pattern"; then
            echo "✅ Found tracking issue link in PR body."
          else
            echo "::error title=No tracking issue linked::PR ${PR_URL} does not link a tracking issue. Add \`Fixes #N\`, \`Closes #N\`, or \`Resolves #N\` to the description, OR apply the \`no-issue-required\` label if this is intentional (refactor, docs, etc)."
            exit 1
          fi

  diff-size:
    name: Diff-size guard
    runs-on: ubuntu-22.04
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'large-pr-approved') }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Measure PR diff (excluding generated files)
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Exclude vendored / generated / locked files that legitimately
          # explode line counts when deps move.
          excludes=(
            ':!pnpm-lock.yaml'
            ':!Cargo.lock'
            ':!**/*.snap'
            ':!packages/types/src/**'
            ':!**/dist/**'
            ':!**/target/**'
            ':!**/node_modules/**'
            ':!**/*.lock'
            ':!**/*.min.js'
            ':!**/*.min.css'
            ':!data/**'
            ':!themes/**'
          )
          # Sum additions + deletions to a single "lines changed" number.
          stats=$(git diff --shortstat "$BASE..$HEAD" -- . "${excludes[@]}" || echo "")
          ins=$(echo "$stats" | grep -oE '[0-9]+ insertion' | grep -oE '[0-9]+' || echo 0)
          del=$(echo "$stats" | grep -oE '[0-9]+ deletion' | grep -oE '[0-9]+' || echo 0)
          total=$((ins + del))
          echo "PR changes $total lines (excluding generated)"
          if [ "$total" -gt 3000 ]; then
            echo "::error title=PR too large::$total lines changed exceeds 3000-line hard limit. Split into smaller PRs (each addressing one concern) or apply the \`large-pr-approved\` label after maintainer review."
            exit 1
          elif [ "$total" -gt 800 ]; then
            echo "::warning title=Large PR::$total lines changed exceeds the 800-line soft limit. Consider splitting; large PRs get worse review and hide bugs."
          fi

  welcome-first-time:
    name: First-time contributor welcome
    runs-on: ubuntu-22.04
    if: ${{ github.event.action == 'opened' }}
    permissions:
      pull-requests: write
      issues: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit

      - uses: actions/first-interaction@2ec0f0fd78838633cd1c1342e4536d49ef72be54 # v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          pr-message: |
            👋 Thanks for opening your first SpiritStream PR.

            A few quick things before review:

            1. **Read** [CONTRIBUTING.md](https://github.com/${{ github.repository }}/blob/main/CONTRIBUTING.md) — covers code style, commit format, and the AI-assistance disclosure rule.
            2. **If you used AI** (Claude / Copilot / ChatGPT / etc.) to generate or substantially edit any of this change, your commit message must include an `Assisted-by:` trailer (e.g. `Assisted-by: Claude (Sonnet 4.6)`). You — the human submitter — are fully responsible for correctness and security.
            3. **Link a tracking issue** in the description (`Fixes #N` / `Closes #N`). If you can't, your PR is probably solving a problem we haven't yet decided to solve; open an issue first.
            4. **Vulnerable users** read every line of code we ship. Don't add error swallowing, silent fallbacks, or "this should work" placeholders.

            A maintainer will review your CI results and code shortly. Welcome aboard 💜
          issue-message: ''
