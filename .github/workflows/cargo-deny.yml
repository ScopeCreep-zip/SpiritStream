name: cargo-deny

# OWASP CICD-SEC-3 (Dependency Chain Abuse) + NIST SSDF PW.3.
# cargo-deny enforces the supply-chain policy declared in deny.toml:
# license allowlist, advisory blocks, source/git restrictions, and
# wildcard ban. Runs on every push + PR.

on:
  push:
    branches: [main, kali/rewrite]
  pull_request:
    branches: [main, kali/rewrite]
  schedule:
    # Daily catches newly-published advisories against unchanged code.
    - cron: '37 7 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cargo-deny:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Split per check so a license problem doesn't mask an advisory.
        # Status checks are required individually in branch protection.
        checks:
          - advisories
          - bans
          - licenses
          - sources
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master @ 2026-05; no semver tags
        with:
          toolchain: stable

      - name: Install cargo-deny
        run: cargo install --locked cargo-deny

      - name: cargo deny check ${{ matrix.checks }}
        run: cargo deny --all-features check ${{ matrix.checks }}
