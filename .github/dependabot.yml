# Supply-chain hygiene — weekly bump of every ecosystem we depend on.
# Cargo + npm + GitHub Actions + Docker all surface through the same
# weekly PR cadence so a maintainer reviews them as a batch.
#
# Pairs with .github/workflows/cargo-deny.yml + dependency-review.yml:
# Dependabot ships the bumps, the review workflows gate them on
# license / advisory / source policy before merge.
#
# SHA-pinning of actions (per CISA "Defending CI/CD") is preserved
# across bumps: Dependabot rewrites the SHA AND the trailing version
# comment, so `chore(deps,ci)` PRs are still single-line audit-able.

version: 2
updates:
  # Rust workspace at the repo root.
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      # Patch / minor security bumps batched into one PR per week.
      security:
        applies-to: security-updates
      # Non-security minor bumps grouped to keep PR noise down.
      rust-deps:
        applies-to: version-updates
        update-types: [minor, patch]
    labels: ["dependencies", "rust"]
    commit-message:
      prefix: "chore(deps,rust)"
      include: scope

  # pnpm workspace (frontend + shared packages).
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      security:
        applies-to: security-updates
      js-deps:
        applies-to: version-updates
        update-types: [minor, patch]
    labels: ["dependencies", "javascript"]
    commit-message:
      prefix: "chore(deps,js)"
      include: scope
    ignore:
      # Vite dev-server CVEs (GHSA-4w7w-66w2-5vf9, GHSA-p9ff-h696-f583,
      # GHSA-v2wj-q39q-566r) only reachable when server.host exposes the
      # port to the network. SpiritStream binds 127.0.0.1 (Tauri sidecar
      # + localhost-only browser dev). Production-equivalent risk = zero,
      # so the vulnerable version range is ignored. The pnpm.overrides
      # block in package.json still pins to 7.3.2+; this stops Dependabot
      # from re-raising alerts when a sub-7.3.2 transitive sneaks in.
      - dependency-name: "vite"
        versions: [">=7.0.0 <7.3.2"]

  # GitHub Actions versions. With SHA-pinning in workflows, Dependabot
  # rewrites the SHA pin AND the trailing version comment, so the
  # weekly batch stays both auditable and current.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      ci-actions:
        applies-to: version-updates
        update-types: [minor, patch]
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "chore(deps,ci)"
      include: scope

  # Docker base image bumps (Dockerfile in deploy/docker).
  - package-ecosystem: docker
    directory: "/deploy/docker"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ["dependencies", "docker"]
    commit-message:
      prefix: "chore(deps,docker)"
      include: scope
